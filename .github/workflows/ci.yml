name: CI - NEXTRADE AI Phase 1 Foundation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository Hygiene & Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify documents/ and secret files are not tracked in Git
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files documents)" ]; then
            echo "ERROR: documents/ must remain untracked and excluded from Git."
            exit 1
          fi
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "ERROR: Environment secret file tracked in Git: $tracked_env"
            exit 1
          fi
          if grep -q $'\r' infrastructure/docker/postgres/init/01-init-roles.sh; then
            echo "ERROR: 01-init-roles.sh must use LF line endings."
            exit 1
          fi

      - name: Validate Docker Compose schema with .env.example
        run: docker compose --env-file .env.example config --quiet

  backend-unit:
    name: Backend & Worker Lint, Typecheck, Audit & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements-dev.txt
            services/worker/requirements-dev.txt

      - name: Install API and Worker isolated virtual environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-api
          .venv-api/bin/pip install --upgrade pip
          .venv-api/bin/pip install -r services/api/requirements-dev.txt

          python -m venv .venv-worker
          .venv-worker/bin/pip install --upgrade pip
          .venv-worker/bin/pip install -r services/worker/requirements-dev.txt

      - name: Run Ruff lint and format checks
        shell: bash
        run: |
          set -euo pipefail
          .venv-api/bin/python -m ruff check services/api services/worker tests
          .venv-api/bin/python -m ruff format --check services/api services/worker tests

      - name: Run strict mypy checks
        shell: bash
        run: |
          set -euo pipefail
          .venv-api/bin/python -m mypy --config-file services/api/pyproject.toml \
            services/api/app services/api/alembic/env.py services/api/tests
          .venv-worker/bin/python -m mypy --config-file services/worker/pyproject.toml \
            services/worker/worker_app services/worker/tests

      - name: Run dependency vulnerability audit (pip-audit)
        shell: bash
        run: |
          set -euo pipefail
          .venv-api/bin/python -m pip_audit -r services/api/requirements.txt --no-deps
          .venv-worker/bin/python -m pip_audit -r services/worker/requirements.txt --no-deps

      - name: Run API unit tests
        shell: bash
        working-directory: services/api
        run: ../../.venv-api/bin/python -m pytest -m unit

      - name: Run Worker unit tests
        shell: bash
        working-directory: services/worker
        run: ../../.venv-worker/bin/python -m pytest -m unit

  frontend-quality:
    name: Frontend Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.17.0"
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify peer dependency tree
        run: pnpm peers check

      - name: Run Next typegen, TypeScript check, and ESLint
        run: |
          set -euo pipefail
          pnpm exec next typegen
          pnpm typecheck
          pnpm lint

      - name: Run Vitest unit & component tests
        run: pnpm test

      - name: Build production Next.js bundle
        env:
          NEXT_PUBLIC_APP_NAME: NEXTRADE AI
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
        run: pnpm build

  integration-and-e2e:
    name: Full Stack Integration, Alembic Reversibility & Playwright Smoke
    needs:
      - repo-hygiene
      - backend-unit
      - frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.17.0"
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Generate ephemeral CI environment file (no committed secrets)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, secrets

          app_secret = secrets.token_urlsafe(48)
          owner_pw = secrets.token_urlsafe(24)
          app_pw = secrets.token_urlsafe(24)
          redis_pw = secrets.token_urlsafe(24)
          env_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci.env"
          env_path.write_text(
              "\n".join([
                  "APP_NAME=NEXTRADE AI",
                  "APP_ENV=local",
                  "DEBUG=false",
                  "LOG_LEVEL=INFO",
                  "API_PREFIX=/api/v1",
                  f"APP_SECRET={app_secret}",
                  "WEB_HOST_PORT=3000",
                  "API_HOST_PORT=8001",
                  "POSTGRES_HOST_PORT=5435",
                  "REDIS_HOST_PORT=6381",
                  "CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000",
                  "APP_BASE_URL=http://localhost:3000",
                  "API_BASE_URL=http://localhost:8001",
                  "NEXT_PUBLIC_APP_NAME=NEXTRADE AI",
                  "NEXT_PUBLIC_APP_ENV=local",
                  "NEXT_PUBLIC_API_BASE_URL=http://localhost:8001",
                  "INTERNAL_API_BASE_URL=http://api:8000",
                  "POSTGRES_HOST=postgres",
                  "POSTGRES_PORT=5432",
                  "POSTGRES_DB=nextrade",
                  "POSTGRES_OWNER_USER=nextrade_owner",
                  f"POSTGRES_OWNER_PASSWORD={owner_pw}",
                  "POSTGRES_APP_USER=nextrade_app",
                  f"POSTGRES_APP_PASSWORD={app_pw}",
                  f"DATABASE_URL=postgresql+psycopg://nextrade_app:{app_pw}@postgres:5432/nextrade",
                  f"MIGRATION_DATABASE_URL=postgresql+psycopg://nextrade_owner:{owner_pw}@postgres:5432/nextrade",
                  "REDIS_HOST=redis",
                  "REDIS_PORT=6379",
                  "REDIS_DB=0",
                  f"REDIS_PASSWORD={redis_pw}",
                  f"REDIS_URL=redis://:{redis_pw}@redis:6379/0",
                  f"CELERY_BROKER_URL=redis://:{redis_pw}@redis:6379/1",
                  f"CELERY_RESULT_BACKEND=redis://:{redis_pw}@redis:6379/2",
              ]) + "\n",
              encoding="utf-8",
          )
          os.chmod(env_path, 0o600)
          PY

      - name: Build and start 6-service Docker Compose stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNNER_TEMP/ci.env" up --build -d --wait
          docker compose --env-file "$RUNNER_TEMP/ci.env" ps

      - name: Verify non-root container identities and Alembic bootstrap reversibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker compose --env-file "$RUNNER_TEMP/ci.env" exec -T api id -u)" = "10001"
          test "$(docker compose --env-file "$RUNNER_TEMP/ci.env" exec -T worker id -u)" = "10001"
          test "$(docker compose --env-file "$RUNNER_TEMP/ci.env" exec -T web id -u)" = "10001"
          if docker compose --env-file "$RUNNER_TEMP/ci.env" exec -T api printenv | grep -q '^MIGRATION_DATABASE_URL='; then
            echo "ERROR: api runtime container must not carry MIGRATION_DATABASE_URL."
            exit 1
          fi

          set -a
          source "$RUNNER_TEMP/ci.env"
          set +a

          docker compose --env-file "$RUNNER_TEMP/ci.env" run --rm --no-deps \
            -e MIGRATION_DATABASE_URL -e POSTGRES_APP_USER api alembic upgrade head
          docker compose --env-file "$RUNNER_TEMP/ci.env" run --rm --no-deps \
            -e MIGRATION_DATABASE_URL -e POSTGRES_APP_USER api alembic downgrade base
          docker compose --env-file "$RUNNER_TEMP/ci.env" run --rm --no-deps \
            -e MIGRATION_DATABASE_URL -e POSTGRES_APP_USER api alembic upgrade head

      - name: Run cross-service integration tests, Celery task, and Redis 503 failure simulation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-int
          .venv-int/bin/pip install --upgrade pip
          .venv-int/bin/pip install -r services/api/requirements-dev.txt

          set -a
          source "$RUNNER_TEMP/ci.env"
          set +a

          export NEXTRADE_RUN_LIVE_INTEGRATION=1
          export INTEGRATION_API_BASE_URL="http://127.0.0.1:${API_HOST_PORT}"
          export INTEGRATION_WEB_BASE_URL="http://127.0.0.1:${WEB_HOST_PORT}"
          export INTEGRATION_POSTGRES_DSN="postgresql://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT}/${POSTGRES_DB}"
          export INTEGRATION_REDIS_HOST="127.0.0.1"
          export INTEGRATION_REDIS_PORT="${REDIS_HOST_PORT}"
          export INTEGRATION_REDIS_URL="redis://:${REDIS_PASSWORD}@127.0.0.1:${REDIS_HOST_PORT}/0"

          .venv-int/bin/python -m pytest tests/integration/test_foundation_integration.py -p no:asyncio -v

          docker compose --env-file "$RUNNER_TEMP/ci.env" exec -T worker python -c \
            "from worker_app.tasks.system import heartbeat; out = heartbeat.delay().get(timeout=15); assert out['status'] == 'ok'"

          docker compose --env-file "$RUNNER_TEMP/ci.env" stop redis
          status_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${API_HOST_PORT}/api/v1/health)"
          test "$status_code" = "503"

          docker compose --env-file "$RUNNER_TEMP/ci.env" start redis
          for _ in $(seq 1 30); do
            rec_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${API_HOST_PORT}/api/v1/health || true)"
            if [ "$rec_code" = "200" ]; then
              break
            fi
            sleep 1.5
          done
          test "$rec_code" = "200"

      - name: Run Playwright browser E2E smoke test
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps
          EXPECT_HEALTHY_STACK=true PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 pnpm test:e2e

      - name: Inspect container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose --env-file "$RUNNER_TEMP/ci.env" ps -a || true
          docker compose --env-file "$RUNNER_TEMP/ci.env" logs --tail 60 api worker scheduler web || true

      - name: Clean up ephemeral CI containers and env file
        if: always()
        shell: bash
        run: |
          docker compose --env-file "$RUNNER_TEMP/ci.env" stop || true
          rm -f "$RUNNER_TEMP/ci.env"
