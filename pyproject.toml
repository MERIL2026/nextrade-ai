[project]
name = "nextrade-ai"
version = "0.1.0"
description = "NEXTRADE AI — Phase 1 Engineering Foundation (Modular Monolith & Web Platform)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "venv",
  ".next",
  "node_modules",
  "documents",
  "dist",
  "build",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "S",
  "SIM",
  "ASYNC",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S105", "S106"]
"tests/**/*.py" = ["S101", "S105", "S106"]
"services/api/alembic/versions/*.py" = ["I001", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker_app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = [
  "services/api/tests",
  "services/worker/tests",
  "tests",
]
markers = [
  "unit: Fast unit tests without external network/database dependencies",
  "integration: Tests requiring PostgreSQL, Redis, or full Compose stack",
]
